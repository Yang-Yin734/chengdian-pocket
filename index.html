<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成电口袋 · 更新源</title>
<style>
  /* 2026-10-31 可达性：--sub 原为 #797F89，在白卡上 4.03、在 #F4F7FE 上 3.76，不达 AA 的 4.5。
     #616B76 在 #fff/#F4F7FE/#F2F5FC/#EAEDFF 上分别是 5.42/5.06/4.97/4.66，全部过线且仍是「次要文字」的观感。 */
  :root { --blue:#3455C8; --ink:#131D33; --sub:#616B76; --bg:#F2F5FC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 20px 64px; }
  .card { background:#fff; border-radius:18px; padding:24px; box-shadow:0 6px 24px rgba(19,29,51,.07); }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { margin:0 0 20px; color:var(--sub); font-size:13px; }
  .ver { display:inline-block; background:#EAEDFF; color:var(--blue);
         border-radius:999px; padding:3px 12px; font-size:13px; margin-bottom:14px; }
  .notes { margin:0 0 20px; padding:14px 16px; background:#F4F7FE; border-radius:12px; font-size:14px; }
  a.btn { display:inline-block; background:var(--blue); color:#fff; text-decoration:none;
          padding:12px 22px; border-radius:999px; font-size:15px; font-weight:600; }
  .meta { margin-top:22px; font-size:12px; color:var(--sub); word-break:break-all; }
  .meta code { background:#F4F7FE; padding:2px 6px; border-radius:6px; }
  .foot { margin-top:22px; font-size:12px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>成电口袋 · 更新源</h1>
    <p class="sub">个人开发的电子科技大学校园助手 · 非官方应用</p>

    <span class="ver" id="ver">读取中…</span>
    <div class="notes" id="notes">正在读取版本信息。</div>

    <a class="btn" id="dl" href="#">下载 APK</a>

    <div class="meta">
      <div>清单：<code id="murl">version.json</code></div>
      <div>SHA-256：<code id="sha">—</code></div>
    </div>
  </div>
  <p class="foot">App 每次冷启动会读这份 version.json，发现 versionCode 更大就提示更新。</p>
</div>
<script>
fetch('version.json?t=' + Date.now())
  .then(r => r.json())
  .then(v => {
    document.getElementById('ver').textContent = '最新版本 ' + v.versionName + '（' + v.versionCode + '）';
    document.getElementById('notes').textContent = v.notes || '本次更新没有写说明。';
    document.getElementById('dl').href = v.url;
    document.getElementById('sha').textContent = v.sha256 || '未提供（App 会跳过校验）';
    document.getElementById('murl').textContent = location.origin + location.pathname.replace(/[^/]*$/, '') + 'version.json';
  })
  .catch(() => {
    document.getElementById('ver').textContent = '读不到 version.json';
    document.getElementById('notes').textContent =
      '如果这是本地打开的文件，请用 http 服务访问；部署到静态托管后才会正常读取。';
  });
</script>
</body>
</html>
